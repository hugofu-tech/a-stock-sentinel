name: A股情绪晨间预警

on:
  schedule:
    # 北京时间 9:00 = UTC 01:00（A股开盘前30分钟）
    - cron: '0 1 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  sentiment-alert:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai  # 设置北京时区
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install baostock pandas requests pytz numpy
        
    - name: Run sentiment analysis
      run: |
        python main.py
        echo "Exit code: $?"
        ls -la *.md || echo "No report files generated"
      env:
        TZ: Asia/Shanghai
        FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
        FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        FEISHU_TARGET: ${{ secrets.FEISHU_TARGET }}
        
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: execution-logs
        path: '*.md'
        retention-days: 7

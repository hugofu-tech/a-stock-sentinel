name: Trump Social Media -> Polymarket Signals

on:
  schedule:
    # Run every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no email)'
        required: false
        default: 'false'
        type: boolean

env:
  TZ: America/New_York

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q requests beautifulsoup4 anthropic

      - name: Download post store (state)
        uses: actions/cache@v4
        with:
          path: data/seen_posts.json
          key: trump-posts-${{ github.run_id }}
          restore-keys: |
            trump-posts-

      - name: Run Trump Sentinel
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python trump_sentinel.py --dry-run
          else
            python trump_sentinel.py
          fi

      - name: Upload signal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signals-${{ github.run_number }}
          path: data/signals_*.json
          retention-days: 30
          if-no-files-found: ignore
